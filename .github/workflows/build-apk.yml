name: Build 4-Track Studio APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      run: |
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        
        # Accept licenses
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # Install required components
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install \
          "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" \
          "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" || true
        
        # Verify android.jar exists
        ls -la $ANDROID_SDK_ROOT/platforms/android-${{ env.ANDROID_COMPILE_SDK }}/android.jar

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      env:
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Verify APK structure
      run: |
        APK_PATH=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
        if [ -z "$APK_PATH" ]; then
          echo "ERROR: No APK found"
          exit 1
        fi
        echo "APK found: $APK_PATH"
        echo "=== APK Contents ==="
        unzip -l "$APK_PATH"
        
        echo ""
        echo "=== Checking required files ==="
        if unzip -l "$APK_PATH" | grep -q "classes.dex"; then
          echo "✓ classes.dex found"
        else
          echo "✗ classes.dex NOT found - BUILD FAILED"
          exit 1
        fi
        
        if unzip -l "$APK_PATH" | grep -q "AndroidManifest.xml"; then
          echo "✓ AndroidManifest.xml found"
        else
          echo "✗ AndroidManifest.xml NOT found - BUILD FAILED"
          exit 1
        fi
        
        if unzip -l "$APK_PATH" | grep -q "resources.arsc"; then
          echo "✓ resources.arsc found"
        else
          echo "✗ resources.arsc NOT found - BUILD FAILED"
          exit 1
        fi
        
        if unzip -l "$APK_PATH" | grep -q "assets/index.html"; then
          echo "✓ assets/index.html found"
        else
          echo "✗ assets/index.html NOT found - BUILD FAILED"
          exit 1
        fi

    - name: Verify APK signature
      run: |
        APK_PATH=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
        echo "Verifying signature..."
        "$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose "$APK_PATH"
        echo "✓ Signature verification passed"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: 4-track-studio-debug
        path: app/build/outputs/apk/**/*.apk
        retention-days: 30
